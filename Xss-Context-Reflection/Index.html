<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reflected XSS Lab - HTML Context</title>
    <style>
        body {
            background-color: #111; /* Dark theme for cybersecurity feel */
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        input, button {
            padding: 8px;
            margin: 5px 0;
        }
        .output {
            margin-top: 20px;
            padding: 10px;
            background-color: #222;
            border: 1px solid #555;
        }
    </style>
</head>
<body>
    <h1>Reflected XSS Lab - HTML Context</h1>
    <p>Enter your name below and see how it reflects on the page. Try to test your XSS payloads safely!</p>

    <!-- Input form -->
    <form method="GET">
        <label for="name">Your Name: </label>
        <input type="text" id="name" name="name" placeholder="Enter name">
        <button type="submit">Submit</button>
    </form>

    <div class="output">
        <strong>Reflected Output:</strong><br>
        <!-- Reflected content goes here -->
        <div id="result">
            <!-- JavaScript will insert input here -->
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name');

        if (name) {
            // WARNING: This is intentionally vulnerable to teach reflected XSS
            document.getElementById('result').innerHTML = `Hello, ${name}!`;
        }
    </script>
</body>
</html>
