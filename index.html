<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stored XSS Lab</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px auto;
      max-width: 700px;
      line-height: 1.6;
    }
    h2 {
      margin-bottom: 10px;
    }
    form {
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 70%;
      padding: 8px;
    }
    button {
      padding: 8px 15px;
      background: #111;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #333;
    }
    #comments p {
      background: #f4f4f4;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h2>💬 Stored XSS Lab</h2>
  <p>Enter a comment below. The comment will be saved in <b>localStorage</b> to simulate stored XSS.</p>

  <form id="commentForm">
    <input type="text" id="comment" placeholder="Write something..." required />
    <button type="submit">Submit</button>
  </form>

  <h3>Comments:</h3>
  <div id="comments"></div>

  <script>
    // Load stored comments from localStorage
    if (localStorage.getItem("comments")) {
      document.getElementById("comments").innerHTML = localStorage.getItem("comments");
    }

    // Save new comments
    document.getElementById("commentForm").onsubmit = function(e) {
      e.preventDefault();
      let comment = document.getElementById("comment").value;
      let current = document.getElementById("comments").innerHTML;
      let updated = current + "<p>" + comment + "</p>";
      document.getElementById("comments").innerHTML = updated;
      localStorage.setItem("comments", updated);
      document.getElementById("comment").value = "";
    }
  </script>
</body>
</html>
