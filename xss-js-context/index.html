<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XSS JS Context Lab</title>
<style>
  body { background-color:#111; color:#fff; font-family:Arial, sans-serif; padding:20px; }
  h1 { text-align:center; margin-bottom:20px; }
  form { text-align:center; margin-bottom:20px; }
  input, button { padding:8px; margin:5px; border-radius:4px; border:none; }
  button { background-color:#111; color:#fff; cursor:pointer; }
  button:hover { background-color:#333; }
  #output { background:#222; padding:15px; border-radius:6px; max-width:600px; margin:20px auto; }
</style>
</head>
<body>

<h1>XSS Lab - JavaScript Context</h1>
<p style="text-align:center;">Type your name below to see how JavaScript can reflect input. Try safe payloads like <code>');alert(1);//</code></p>

<form id="xssForm">
  <input type="text" name="name" placeholder="Enter name">
  <button type="submit">Submit</button>
</form>

<div id="output"></div>

<script>
const form = document.getElementById('xssForm');
const output = document.getElementById('output');

form.addEventListener('submit', (e)=>{
    e.preventDefault();
    const name = form.name.value;

    // Simulate JS context reflection safely
    // Instead of eval(), we create a script element dynamically
    output.innerHTML = ''; // clear previous
    const p = document.createElement('p');
    p.textContent = `Hello ${name}! (Simulated JS context)`;
    output.appendChild(p);

    // Optional: demonstrate real JS execution in controlled way
    // Create a script element dynamically (for teaching purposes)
    try {
        const script = document.createElement('script');
        script.innerHTML = `console.log('Simulated execution with: ${name}');`;
        output.appendChild(script);
    } catch(err) {
        console.error('Script injection blocked by browser', err);
    }
});
</script>

</body>
</html>
